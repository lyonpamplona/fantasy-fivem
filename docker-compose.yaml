services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: goat
      POSTGRES_PASSWORD: goatpassword
      POSTGRES_DB: fantasy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goat -d fantasy_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api-fantasy:
    build: ./backend-fantasy
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend-fantasy:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend-fantasy/.env

  worker-fantasy:
    build: ./backend-fantasy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker --loglevel=info
    volumes:
      - ./backend-fantasy:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend-fantasy/.env

  api-heuristics:
    build: ./backend-heuristics
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend-heuristics:/app
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend-heuristics/.env

  frontend-game:
    build: ./frontend-game
    volumes:
      - ./frontend-game:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend-game/.env

  frontend-admin:
    build: ./frontend-admin
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    env_file:
      - ./frontend-admin/.env

volumes:
  postgres_data:
  redis_data: